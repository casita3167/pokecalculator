name: One-time homepage checkbox cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-pick.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix_home_pick.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokecalcu/index.html
          git rm .github/fix_home_pick.py .github/workflows/fix-home-pick.yml
          git commit -m "Finish homepage checkbox cleanup"
          git push
