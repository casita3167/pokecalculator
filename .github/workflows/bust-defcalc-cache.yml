name: One-time defense calculator cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-defcalc-cache.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cached defense calculator assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pokecalcu/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="defcalc.css"','href="defcalc.css?v=20260905-2"')
          s=s.replace('src="defcalc.js"','src="defcalc.js?v=20260905-2"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokecalcu/index.html
          git rm .github/workflows/bust-defcalc-cache.yml
          git commit -m "Bust defense calculator asset cache"
          git push
