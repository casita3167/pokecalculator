name: One-time homepage defense calculator update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-home-defense-calculator.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage
        run: python3 .github/update_home.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokecalcu/index.html
          git rm .github/update_home.py .github/workflows/update-home-defense-calculator.yml
          git commit -m "Redesign homepage defense calculator"
          git push
